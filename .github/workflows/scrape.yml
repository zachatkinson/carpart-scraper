name: Scrape Catalog

on:
  schedule:
    - cron: "0 3 * * *"  # Daily at 3 AM UTC (off-peak)
  workflow_dispatch:
    inputs:
      make:
        description: "Vehicle make (e.g. Honda). Empty = all makes."
        required: false
        type: string
        default: ""
      force_full:
        description: "Force full re-scrape, ignoring cached ETags."
        required: false
        type: boolean
        default: false
      push_full:
        description: "Push the complete catalog to WordPress instead of the delta (recovery after a failed import)."
        required: false
        type: boolean
        default: false

concurrency:
  group: scrape-catalog
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # lets the keepalive step re-enable this workflow

jobs:
  scrape:
    name: Scrape Catalog
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Restore checkpoints cache
        uses: actions/cache/restore@v5
        with:
          path: checkpoints/
          key: scrape-checkpoints-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            scrape-checkpoints-${{ github.ref_name }}-
            scrape-checkpoints-

      - name: Scrape
        env:
          CSF_WP_URL: ${{ secrets.CSF_WP_URL }}
          CSF_WP_API_KEY: ${{ secrets.CSF_WP_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force_full }}" = "true" ]; then
            FORCE_FLAG="--force-full"
          fi

          MAKE_FLAG=""
          if [ -n "${{ inputs.make }}" ]; then
            MAKE_FLAG="--make ${{ inputs.make }}"
          fi

          PUSH_FLAG=""
          if [ "${{ inputs.push_full }}" = "true" ]; then
            PUSH_FLAG="--push-full"
          fi

          uv run carpart scrape \
            $MAKE_FLAG \
            $FORCE_FLAG \
            $PUSH_FLAG \
            --resume \
            --time-budget 350 \
            --sync-images \
            --wp-url "$CSF_WP_URL" \
            --wp-api-key "$CSF_WP_API_KEY" \
          || EXIT_CODE=$?

          # Exit code 3 = time budget reached (graceful, checkpoints saved)
          if [ "${EXIT_CODE:-0}" -eq 3 ]; then
            echo "::warning::Time budget reached — will resume on next run"
          elif [ "${EXIT_CODE:-0}" -ne 0 ]; then
            exit "$EXIT_CODE"
          fi

      - name: Save checkpoints cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: checkpoints/
          key: scrape-checkpoints-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload artifacts on failure or timeout
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: debug-scrape
          path: |
            exports/
            checkpoints/
          retention-days: 7

      # GitHub disables cron schedules after 60 days without repo activity.
      # Re-enabling via the API resets that timer without needing commits.
      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/scrape.yml/enable" \
            && echo "Workflow inactivity timer reset" \
            || echo "::warning::Keepalive call failed — schedule may auto-disable after 60 days of repo inactivity"

      # Dead-man's-switch: healthchecks.io (or compatible) alerts if no ping
      # arrives on schedule, catching silent failures like a disabled cron.
      # Skipped when the HEALTHCHECK_PING_URL secret is not configured.
      - name: Ping healthcheck
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_PING_URL }}
        run: |
          if [ -z "$HC_URL" ]; then
            echo "HEALTHCHECK_PING_URL not set — skipping ping"
            exit 0
          fi
          if [ "${{ job.status }}" = "success" ]; then
            curl -fsS -m 10 --retry 3 "$HC_URL" > /dev/null
          else
            curl -fsS -m 10 --retry 3 "$HC_URL/fail" > /dev/null
          fi
