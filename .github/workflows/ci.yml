name: CI

on:
  push:
    branches: [master, main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [master, main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"

# A newer push to the same branch supersedes a running CI for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # The whole unit + integration suite runs in under 30 seconds, so one job
      # beats a matrix whose setup dwarfs its tests. The coverage floor is the
      # measured figure at the time of writing; raise it, never lower it.
      - name: Run unit and integration tests with coverage
        run: |
          uv run pytest tests/unit tests/integration \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=88

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: tests
          fail_ci_if_error: false

  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
          enable-cache: true
          save-cache: false

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run performance tests
        run: uv run pytest tests/performance -q

  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
          enable-cache: true
          save-cache: false

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
          enable-cache: true
          save-cache: false

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Fails on any known vulnerability in the locked environment. Static
      # security linting is covered by ruff's flake8-bandit (S) rules in lint.
      - name: Audit locked dependencies
        run: uv run --with pip-audit pip-audit --progress-spinner off

  plugin:
    name: WordPress Plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carpart-scraper-wp
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          working-directory: carpart-scraper-wp

      - name: Run PHP unit tests
        run: vendor/bin/phpunit -c tests/phpunit.xml --testsuite='Unit Tests' --no-coverage

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: carpart-scraper-wp/package-lock.json

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build blocks
        run: npm run build

      - name: Verify every block bundle was built
        run: |
          for block in part-finder part-blocks product-catalog single-product; do
            test -s "blocks/build/$block/index.js" || { echo "::error::missing bundle for $block"; exit 1; }
            test -s "blocks/build/$block/index.asset.php" || { echo "::error::missing asset manifest for $block"; exit 1; }
          done
